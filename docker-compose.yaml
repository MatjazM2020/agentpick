services:
  # Vector database for embeddings and RAG
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT_API_KEY=
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - agentpick

  # Relational database for metadata and ranking
  postgres:
    image: postgres:16
    container_name: agentpick-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: agentpick
      POSTGRES_USER: agentpick
      POSTGRES_PASSWORD: agentpick_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpick"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentpick

  # AgentPick recommendation backend
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: agentpick-backend:latest
    container_name: agentpick-backend
    ports:
      - "5002:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - ENV=production
      # Retriever reads QDRANT_URL or QDRANT_HOST + QDRANT_PORT (not localhost inside the container)
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # PostgreSQL for metadata and relational retrieval
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=agentpick
      - POSTGRES_USER=agentpick
      - POSTGRES_PASSWORD=agentpick_password
      # OpenAI (Requirements Analyst + Synthesizer via Microsoft Agent Framework)
      - OPENAI_CHAT_MODEL_ID=${OPENAI_CHAT_MODEL_ID:-gpt-5.4-nano}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Activity log — must match the volume mount below
      - AGENT_ACTIVITY_LOG=/app/logs/agentpick.log
    volumes:
      - backend_data:/app/data
      - ./backend/logs:/app/logs
      # Persist the Hugging Face cache so the ~1.3 GB embedding model is not
      # re-downloaded every time the container is recreated
      - hf_cache:/home/appuser/.cache/huggingface
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5000"]
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - agentpick

  # Open WebUI frontend and unified backend
  ui:
    build:
      context: ./UI
      dockerfile: Dockerfile
      args:
        - USE_CUDA=false
        - USE_OLLAMA=false
        - USE_SLIM=true
        - BUILD_HASH=docker-build
    image: agentpick-ui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://backend:5000/v1
      - OPENAI_API_KEY=dummy
      - DEFAULT_MODELS=agentpick-recommender
      - DEFAULT_PINNED_MODELS=agentpick-recommender
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-in-production}
      - ENV=production
      # Starter prompts on the empty chat screen, drawn from the evaluation set
      - >-
        DEFAULT_PROMPT_SUGGESTIONS=[
        {"title": ["Model for writing code", "under 15B parameters"],
        "content": "I need an instruction-tuned coding model under 15B parameters that I can run locally. What do you recommend?"},
        {"title": ["Fits in 8 GB of VRAM", "multilingual assistant"],
        "content": "Recommend an instruction-tuned multilingual chat model that fits in 8 GB of VRAM."},
        {"title": ["Largest instruction-tuned model", "in the catalog"],
        "content": "Which is the largest instruction-tuned model in the catalog?"},
        {"title": ["Summarizing legal documents", "on an ordinary CPU"],
        "content": "Suggest a model for summarizing legal documents that runs on an ordinary CPU without a GPU."},
        {"title": ["Best reasoning model", "no hardware constraints"],
        "content": "I want the strongest reasoning-focused model available and I have no hardware constraints."},
        {"title": ["Which model should I", "run locally?"],
        "content": "Which model should I run locally?"}
        ]
    volumes:
      - ui_data:/app/backend/data
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - agentpick

volumes:
  qdrant_data:
  backend_data:
  hf_cache:
  ui_data:
  postgres_data:

networks:
  agentpick:
    driver: bridge
